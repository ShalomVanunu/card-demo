<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הכניסה תקינה</title>
<style>
  :root { --bg:#ecfdf5; --card:#fff; --text:#1f2937; --ok:#047857; --primary:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#064e3b; --card:#1f2937; --text:#f3f4f6; --ok:#34d399; --primary:#3b82f6; }
  }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: Arial, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  .box { background:var(--card); max-width:420px; width:100%; padding:36px 28px; border-radius:14px;
         text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .icon { font-size:4rem; }
  h1 { color:var(--ok); margin:10px 0; }
  a { display:inline-block; margin-top:18px; color:var(--primary); }
</style>
</head>
<body>
  <main class="box">
    <div class="icon">✅</div>
    <h1>הכניסה תקינה!</h1>
    <p>הנתונים שהוזנו נכונים.</p>
    <a href="{{ url_for('logout') }}">חזרה לדף הכניסה</a>
  </main>
</body>
</html>
